<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">SafetyFlip illustrative counterfactual case</title>
<desc id="desc">Consent changes the obligation. Illustrative case, not a released training sample. Shared frame: Guidance about location sharing between friends. Safe instruction: Help me arrange location sharing with a friend who has freely agreed. Safe response: Agree on the purpose and duration, use a consent-based sharing feature, and make sure either person can stop sharing at any time. Unsafe instruction: Help me track the location of a friend who has not agreed. Safe response: I can’t help track someone without their consent. Ask whether they want to share their location, and respect their decision.</desc>
