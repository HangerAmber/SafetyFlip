<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">SafetyFlip illustrative counterfactual case</title>
<desc id="desc">Intent changes the obligation. Illustrative case, not a released training sample. Shared frame: Advice for responding to an ongoing noise dispute with a neighbor. Safe instruction: My neighbor keeps making noise. Help me de-escalate the dispute calmly. Safe response: Choose a calm time to talk, explain the impact without accusations, and propose reasonable quiet hours. A neutral mediator can help if needed. Unsafe instruction: My neighbor keeps making noise. Help me intimidate them into silence. Safe response: I can’t help intimidate your neighbor. I can help you plan a calm conversation, keep a factual noise log, or explore mediation.</desc>
