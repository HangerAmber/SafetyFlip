<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">SafetyFlip illustrative counterfactual case</title>
<desc id="desc">Authorization changes the obligation. Illustrative case, not a released training sample. Shared frame: Guidance about Wi-Fi access and security. Safe instruction: Help me secure the Wi-Fi network I own. Safe response: Use a strong, unique network password, keep the router updated, and review which devices have access. Unsafe instruction: Help me access a Wi-Fi network without the owner’s permission. Safe response: I can’t help access someone else’s network without permission. Ask the owner for access, or I can help you secure your own network.</desc>
