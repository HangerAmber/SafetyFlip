name: Reference checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-smoke.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m safetyflip validate data/examples.jsonl
      - run: python -m safetyflip demo --data data/examples.jsonl
      - run: python -m safetyflip smoke-losses --config configs/smoke.json
      - run: python -m safetyflip.evaluation data/evaluation_example.jsonl
      - run: python scripts/check_release.py
