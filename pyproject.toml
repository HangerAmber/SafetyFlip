[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetyflip-reference"
version = "0.1.0"
description = "Anonymous SafetyFlip reference components and illustrative local demos"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
smoke = ["torch==2.5.1"]

[project.scripts]
safetyflip = "safetyflip.__main__:main"

[tool.setuptools.packages.find]
include = ["safetyflip*"]
